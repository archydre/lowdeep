name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build Dual Package (ESM + CJS)
        run: bun run build

      - name: Verify Dual Package Imports with Node.js
        run: |
          node -e "import('./dist/index.js').then(m => console.log('ESM OK:', typeof m.default))"
          node -e "const m = require('./dist/index.cjs'); console.log('CJS OK:', typeof m.default)"

      - name: Run Test Suite
        run: bun test
