name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Check & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npm authentication)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build Dual Package
        run: bun run build

      - name: Run Tests
        run: bun test

      - name: Publish if version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          REGISTRY_VERSION=$(npm view lowdeep version 2>/dev/null || echo "0.0.0")
          echo "Package version:  $PACKAGE_VERSION"
          echo "Registry version: $REGISTRY_VERSION"

          if [ "$PACKAGE_VERSION" != "$REGISTRY_VERSION" ]; then
            echo "🚀 New version detected ($PACKAGE_VERSION). Publishing to npm..."
            npm publish --access public --provenance
            echo "✅ Successfully published lowdeep@$PACKAGE_VERSION to npm!"
          else
            echo "ℹ️ Version $PACKAGE_VERSION is already published on npm. Skipping publication."
          fi
